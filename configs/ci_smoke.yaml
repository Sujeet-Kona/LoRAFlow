data:
  train_file: data/train.jsonl
  validation_file: data/validation.jsonl
  max_seq_length: 96
  # Small slice keeps the CI job fast; the point is wiring, not learning.
  max_train_examples: 24

lora:
  # GPT-2 attention projections are named c_attn rather than q_proj/v_proj.
  rank: 4
  alpha: 8
  dropout: 0.0
  target_modules: [c_attn]

training:
  # Random-weight toy model: it downloads in a second and exercises the real
  # TRL + PEFT code path without pretending to learn anything.
  base_model: sshleifer/tiny-gpt2
  output_dir: artifacts/ci-smoke
  num_train_epochs: 1
  max_steps: 2
  learning_rate: 0.001
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  eval_steps: 1
  save_steps: 1
  logging_steps: 1
  seed: 0
  device: cpu
  dtype: fp32
  run_name: ci-smoke

evaluation:
  output_file: artifacts/ci-smoke/evaluation_report.json
  max_examples: 6
  generation_examples: 2
  max_new_tokens: 8
  batch_size: 2

tracking:
  enabled: false

export:
  output_dir: artifacts/ci-smoke/exported
