services:
  api:
    build: .
    image: loraflow:local
    ports:
      - "8000:8000"
    environment:
      HF_HOME: /data/huggingface
      TORCH_NUM_THREADS: "4"
      LORAFLOW_MLFLOW_TRACKING_URI: sqlite:////mlflow/mlflow.db
      LORAFLOW_MLFLOW_ARTIFACTS_DIR: file:///mlflow/artifacts
    volumes:
      - hf-cache:/data/huggingface
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./mlflow-data:/mlflow
    command: ["loraflow", "serve", "--config", "configs/train.yaml", "--host", "0.0.0.0", "--port", "8000"]

  # One-shot pipeline stages. Each service can build the same image itself.
  train:
    build: .
    image: loraflow:local
    profiles: ["pipeline"]
    environment:
      HF_HOME: /data/huggingface
      LORAFLOW_MLFLOW_TRACKING_URI: sqlite:////mlflow/mlflow.db
      LORAFLOW_MLFLOW_ARTIFACTS_DIR: file:///mlflow/artifacts
    volumes:
      - hf-cache:/data/huggingface
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./mlflow-data:/mlflow
    command: ["loraflow", "train", "--config", "configs/train.yaml"]

  evaluate:
    build: .
    image: loraflow:local
    profiles: ["pipeline"]
    environment:
      HF_HOME: /data/huggingface
      LORAFLOW_MLFLOW_TRACKING_URI: sqlite:////mlflow/mlflow.db
      LORAFLOW_MLFLOW_ARTIFACTS_DIR: file:///mlflow/artifacts
    volumes:
      - hf-cache:/data/huggingface
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./mlflow-data:/mlflow
    command: ["loraflow", "evaluate", "--config", "configs/train.yaml"]

  export:
    build: .
    image: loraflow:local
    profiles: ["pipeline"]
    environment:
      HF_HOME: /data/huggingface
    volumes:
      - hf-cache:/data/huggingface
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    command: ["loraflow", "export", "--config", "configs/train.yaml"]

  mlflow:
    image: mlflow/mlflow:3.18.0
    profiles: ["tracking"]
    ports:
      - "5000:5000"
    volumes:
      # Same persistent store and artifact directory as the pipeline containers.
      - ./mlflow-data:/mlflow
    command:
      - mlflow
      - ui
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - file:///mlflow/artifacts

volumes:
  hf-cache:
