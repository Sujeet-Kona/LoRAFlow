services:
  api:
    build: .
    image: loraflow:local
    ports:
      - "8000:8000"
    environment:
      HF_HOME: /data/huggingface
      TORCH_NUM_THREADS: "4"
    volumes:
      - hf-cache:/data/huggingface
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    command: ["loraflow", "serve", "--config", "configs/train.yaml", "--host", "0.0.0.0", "--port", "8000"]

  # One-shot pipeline stages. Each service can build the same image itself.
  train:
    build: .
    image: loraflow:local
    profiles: ["pipeline"]
    volumes:
      - hf-cache:/data/huggingface
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    command: ["loraflow", "train", "--config", "configs/train.yaml"]

  evaluate:
    build: .
    image: loraflow:local
    profiles: ["pipeline"]
    volumes:
      - hf-cache:/data/huggingface
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    command: ["loraflow", "evaluate", "--config", "configs/train.yaml"]

  export:
    build: .
    image: loraflow:local
    profiles: ["pipeline"]
    volumes:
      - hf-cache:/data/huggingface
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    command: ["loraflow", "export", "--config", "configs/train.yaml"]

  mlflow:
    image: mlflow/mlflow:3.18.0
    profiles: ["tracking"]
    ports:
      - "5000:5000"
    volumes:
      # These paths must match the training container's resolved paths.
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    command:
      - mlflow
      - ui
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////app/mlflow.db
      - --default-artifact-root
      - file:///app/mlartifacts

volumes:
  hf-cache:
