[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loraflow"
version = "0.1.0"
description = "A modular LoRA fine-tuning, evaluation, and serving pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.40",
  "datasets>=2.18",
  "peft>=0.10",
  "trl>=0.8",
  "accelerate>=0.28",
  "mlflow>=2.10",
]
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "prometheus-client>=0.20",
  "transformers>=4.40",
  "peft>=0.10",
  "torch>=2.2",
]
qlora = [
  "bitsandbytes>=0.43; platform_system == 'Linux'",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
